<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SIETE PECADOS</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{--tinta:#1A1026;--crema:#FFE9C7;--rojo:#FF3B30;--morado:#9B5CFF;--verde:#39D353;--naranja:#FF8A1F;--cian:#2EC8FF;--rosa:#FF4FA3;--amarillo:#FFD23F;
--ease-salto:cubic-bezier(.34,1.56,.64,1);--ease-seco:cubic-bezier(.2,.8,.2,1);--ease-golpe:cubic-bezier(.7,0,.84,0);
--bg:var(--tinta);--pnl:#241733;--pnl2:#2e1e40;--linea:#3d2a52;--tx:var(--crema);--mut:#a893b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;position:relative;height:100vh;height:100dvh;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:16px 16px 26px;overflow-y:auto}
.screen.on{display:flex}
h1,h2,h3{margin:0;font-weight:800}
#cover{padding:0;overflow:hidden}
/* portada real */
.ap-portada{position:relative;overflow:hidden;background:var(--tinta);--dc:830ms;--ds:1090ms;--db:1350ms}
.ap-portada-fondo{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.ap-bombillas{position:absolute;top:0;left:0;width:100%;height:auto;z-index:1}
.ap-bombilla{fill:#3a3550;transform-box:fill-box;transform-origin:50% 0;animation:ap-enciende 200ms var(--ease-salto) calc(var(--i)*45ms) forwards}
@keyframes ap-enciende{0%{fill:#3a3550;transform:scale(.6)}60%{transform:scale(1.35)}100%{fill:var(--c);transform:scale(1)}}
.ap-cabecera{position:absolute;top:9%;left:0;right:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 14px}
.ap-titulo{font-family:'Luckiest Guy',Impact,sans-serif;font-size:clamp(40px,13vw,60px);line-height:1;text-align:center;display:flex;flex-direction:column;align-items:center;margin:0;color:var(--crema);-webkit-text-stroke:1.5px var(--tinta);text-shadow:0 3px 0 var(--rojo),0 6px 0 var(--tinta)}
.ap-palabra{display:inline-block;white-space:nowrap;position:relative}
.ap-letra{display:inline-block;opacity:0;animation:ap-letra 380ms var(--ease-salto) calc(350ms + var(--i)*40ms) forwards}
@keyframes ap-letra{0%{opacity:0;transform:translateY(-90px) rotate(var(--r)) scale(1.4)}40%{opacity:1}70%{transform:translateY(4px) scale(1.12,.86) rotate(0)}100%{opacity:1;transform:none}}
.ap-cuernos::before,.ap-cuernos::after{content:'';position:absolute;top:-16px;width:15px;height:22px;background:var(--rojo);clip-path:polygon(50% 0,100% 100%,0 100%);transform:scale(0);animation:ap-brota 300ms var(--ease-salto) var(--dc) forwards}
.ap-cuernos::before{left:6%;--rot:-22deg}
.ap-cuernos::after{right:6%;--rot:22deg}
@keyframes ap-brota{0%{transform:scale(0) rotate(var(--rot))}70%{transform:scale(1.25) rotate(var(--rot))}100%{transform:scale(1) rotate(var(--rot))}}
.ap-subtitulo{font-family:'Luckiest Guy',Impact,sans-serif;font-size:clamp(11px,3.6vw,15px);white-space:nowrap;background:var(--rojo);color:var(--crema);padding:7px 12px 4px;border:3px solid var(--tinta);border-radius:8px;box-shadow:0 4px 0 var(--tinta);transform:rotate(-3deg);clip-path:inset(0 100% 0 0);animation:ap-cinta 320ms var(--ease-seco) var(--ds) forwards}
@keyframes ap-cinta{to{clip-path:inset(-12px -12px -12px -12px)}}
.ap-boton{position:absolute;bottom:6%;left:0;right:0;margin:auto;width:fit-content;z-index:3;font-family:'Luckiest Guy',Impact,sans-serif;font-size:28px;letter-spacing:1px;background:var(--amarillo);color:var(--tinta);padding:12px 42px 7px;border:4px solid var(--tinta);border-radius:40px;box-shadow:0 6px 0 var(--tinta);opacity:0;animation:ap-boton 380ms var(--ease-salto) var(--db) forwards,ap-late 400ms ease-in-out calc(var(--db) + 900ms) 2}
.ap-boton:active{box-shadow:0 2px 0 var(--tinta);translate:0 4px}
@keyframes ap-boton{0%{opacity:0;transform:translateY(90px) scale(.6)}60%{opacity:1;transform:translateY(-8px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes ap-late{0%,100%{opacity:1;transform:none}50%{opacity:1;transform:translateY(-4px) scale(1.06)}}
/* candado */
.candado{display:inline-block;transform-origin:50% 70%}
.candado .candado-arco{transform-box:fill-box;transform-origin:85% 100%}
.candado .candado-cuerpo{transform-box:fill-box;transform-origin:50% 100%}
.candado.is-denegado{animation:candado-no 300ms var(--ease-seco)}
@keyframes candado-no{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-7px) rotate(-6deg)}40%{transform:translateX(6px) rotate(5deg)}60%{transform:translateX(-4px) rotate(-3deg)}80%{transform:translateX(2px) rotate(1deg)}}
.candado.is-abierto .candado-arco{animation:candado-arco 400ms var(--ease-salto) forwards}
.candado.is-abierto .candado-cuerpo{animation:candado-cuerpo 400ms var(--ease-seco) forwards}
.candado .candado-ceja{transform-box:fill-box;transition:transform 200ms var(--ease-salto)}
.candado.is-abierto .candado-ojo,.candado.is-abierto .candado-pupila{fill:var(--amarillo);transition:fill 120ms}
.candado.is-abierto .candado-ceja{transform:translateY(-7px)}
.candado.is-denegado .candado-ceja{transform:translateY(3px)}
@keyframes candado-arco{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(4px) rotate(0)}70%{transform:translateY(-34%) rotate(28deg)}100%{transform:translateY(-26%) rotate(24deg)}}
@keyframes candado-cuerpo{0%{transform:scale(1,1)}25%{transform:scale(1.08,.88)}55%{transform:scale(.96,1.05)}100%{transform:scale(1,1)}}
/* carta */
.carta-entra{animation:carta-entra 420ms var(--ease-seco) both}
.carta-sale{animation:carta-sale 220ms var(--ease-golpe) both}
@keyframes carta-entra{0%{opacity:0;transform:translate(60%,30%) rotate(14deg) scale(.9)}10%{opacity:1}70%{transform:translate(-3%,-1%) rotate(-2deg) scale(1.02)}100%{opacity:1;transform:none}}
@keyframes carta-sale{0%{transform:none}100%{transform:translate(-120%,-10%) rotate(-16deg)}}
/* ruleta */
.ruleta{position:relative;display:inline-block;margin-top:40px}
.ruleta-disco{position:relative;z-index:1;display:block;transform:rotate(var(--giro,0deg));will-change:transform}
.ruleta-cuernos{position:absolute;z-index:0;top:-40px;left:50%;margin-left:-150px}
.ruleta-centro{position:absolute;z-index:2;top:50%;left:50%;margin:-36px 0 0 -36px}
.ruleta-flecha{position:absolute;z-index:3;top:-40px;left:50%;margin-left:-31px;transform-origin:50% 0}
.ruleta-disco.is-girando{animation:ruleta-giro var(--dur,4200ms) linear forwards}
@keyframes ruleta-giro{0%{transform:rotate(var(--desde,0deg));animation-timing-function:cubic-bezier(.4,0,1,1)}18%{transform:rotate(calc(var(--desde,0deg) + (var(--giro) - var(--desde,0deg)) * .14));animation-timing-function:cubic-bezier(.25,.4,.35,.97)}100%{transform:rotate(var(--giro))}}
.ruleta.is-girando{animation:ruleta-golpe 180ms var(--ease-golpe) var(--dur,4200ms) both}
.ruleta.is-girando .ruleta-flecha{animation:ruleta-flecha 220ms var(--ease-salto) var(--dur,4200ms) both}
.ruleta.is-girando .ruleta-centro{animation:ruleta-risa 320ms var(--ease-salto) var(--dur,4200ms) both}
@keyframes ruleta-risa{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.25) rotate(-10deg)}60%{transform:scale(.95) rotate(8deg)}}
@keyframes ruleta-golpe{0%{transform:scale(1)}35%{transform:scale(1.06) rotate(-1.5deg)}70%{transform:scale(.98) rotate(.8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes ruleta-flecha{0%{transform:rotate(0)}30%{transform:rotate(-22deg)}100%{transform:rotate(0)}}
/* sello */
.sello-pum{animation:sello-pum 320ms var(--ease-golpe) both;transform-origin:50% 50%}
@keyframes sello-pum{0%{opacity:0;transform:scale(2.6) rotate(-28deg)}15%{opacity:1}70%{transform:scale(.88) rotate(-12deg);animation-timing-function:var(--ease-salto)}100%{opacity:1;transform:scale(1) rotate(-14deg)}}
.impacto-tiembla{animation:impacto 240ms linear 200ms both}
@keyframes impacto{0%,100%{transform:translate(0,0)}15%{transform:translate(-6px,4px)}30%{transform:translate(5px,-5px)}45%{transform:translate(-4px,-2px)}60%{transform:translate(3px,3px)}80%{transform:translate(-1px,1px)}}
/* pantallas */
.pp-entra-dcha{animation:pp-entra-dcha 260ms var(--ease-seco) both}
.pp-sale-izq{animation:pp-sale-izq 260ms var(--ease-seco) both}
.pp-entra-izq{animation:pp-entra-izq 260ms var(--ease-seco) both}
.pp-sale-dcha{animation:pp-sale-dcha 260ms var(--ease-seco) both}
@keyframes pp-entra-dcha{from{transform:translateX(100%)}to{transform:none}}
@keyframes pp-sale-izq{from{transform:none;filter:brightness(1)}to{transform:translateX(-30%);filter:brightness(.55)}}
@keyframes pp-entra-izq{from{transform:translateX(-100%)}to{transform:none}}
@keyframes pp-sale-dcha{from{transform:none;filter:brightness(1)}to{transform:translateX(30%);filter:brightness(.55)}}
/* layout */
.av{position:relative;border-radius:12px;overflow:hidden;background:#120c1c;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.av svg{width:100%;height:100%;display:block}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.top h2{font-family:'Luckiest Guy',Impact,sans-serif;font-size:26px;color:var(--amarillo)}
.lockico{font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 12px}
.cast{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:flex;flex-direction:column;align-items:center;gap:3px;width:50px}
.chip .av{width:42px;height:42px}
.chip b{font-size:9px;color:var(--mut);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.gcard{position:relative;background:var(--pnl);border:2px solid var(--linea);border-radius:16px;padding:14px 13px;min-height:126px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden}
.gcard .ic{font-size:20px;color:var(--rojo);line-height:1}
.gcard h3{font-size:15.5px;margin-top:9px;font-family:'Luckiest Guy',Impact,sans-serif;letter-spacing:.03em;color:var(--crema)}
.gcard p{font-size:11px;color:var(--mut);margin:3px 0 0;line-height:1.3}
.gcard.locked{opacity:.6}
.gcard .pad{position:absolute;top:9px;right:9px}
.gcard .pad svg{width:26px;height:auto}
.gcard:active{transform:scale(.98)}
.gcard.resume{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:11px;border-color:var(--rojo);background:linear-gradient(120deg,#33182a,var(--pnl))}
.gcard.resume .ic{font-size:22px}
.gcard.resume h3{margin-top:0}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.back{border:2px solid var(--linea);background:var(--pnl);color:var(--tx);width:40px;height:40px;border-radius:11px;font-size:18px;cursor:pointer}
.who{display:flex;align-items:center;gap:9px}
.who .av{width:40px;height:40px}
.who b{font-size:14px;display:block}
.who i{font-style:normal;font-size:10px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.card{position:relative;background:linear-gradient(165deg,var(--pnl2),var(--pnl));border:3px solid var(--linea);border-radius:18px;padding:20px 18px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:250px}
.card .tag{font-family:'Luckiest Guy',Impact,sans-serif;font-size:12px;letter-spacing:.22em;color:var(--amarillo);margin-bottom:10px}
.card .txt{font-size:20px;line-height:1.38;font-weight:600}
.card .txt b{color:var(--amarillo)}
.card .duo{display:flex;gap:7px;margin-top:14px}
.card .duo .av{width:36px;height:36px}
.acts{display:flex;gap:9px;margin-top:12px}
.btn{display:block;width:100%;border:3px solid var(--tinta);border-radius:14px;padding:14px;font-size:15px;font-weight:800;font-family:'Luckiest Guy',Impact,sans-serif;letter-spacing:.05em;background:var(--amarillo);color:var(--tinta);cursor:pointer;box-shadow:0 5px 0 var(--tinta)}
.btn:active{box-shadow:0 1px 0 var(--tinta);translate:0 4px}
.btn.ghost{background:var(--pnl);color:var(--crema);border-color:var(--linea);box-shadow:0 5px 0 var(--tinta)}
.btn.rojo{background:var(--rojo);color:var(--crema)}
.btn.sm{padding:11px;font-size:13px}
.acts .btn{flex:1}
.center{text-align:center;align-items:center;justify-content:center}
.big{font-family:'Luckiest Guy',Impact,sans-serif;font-size:74px;line-height:1;color:var(--amarillo)}
.hint{color:var(--mut);font-size:12px;text-align:center;margin-top:12px}
.roul{display:flex;justify-content:center;overflow:hidden;padding-top:8px}
.legend{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.legend .chip{width:44px}
.legend .chip .av{width:30px;height:30px;border-radius:8px}
.legend .chip b{font-size:8px}
.sello{position:absolute;left:50%;top:50%;translate:-50% -50%;width:250px;max-width:86%;pointer-events:none;z-index:5}
.ov{position:fixed;inset:0;background:rgba(10,7,15,.9);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
.ov.on{display:flex}
.box{background:var(--pnl);border:3px solid var(--linea);border-radius:18px;padding:20px;width:100%;max-width:360px;max-height:88vh;overflow:auto;text-align:center}
.box h3{font-family:'Luckiest Guy',Impact,sans-serif;font-size:20px;color:var(--amarillo);margin-bottom:6px}
.box p{color:var(--mut);font-size:12.5px;margin:0 0 14px}
.box .candado svg{width:74px;height:auto;margin-bottom:8px}
input[type=text]{width:100%;background:#140e1e;border:2px solid var(--linea);color:var(--crema);border-radius:11px;padding:13px;font-size:17px;font-family:inherit;text-align:center;letter-spacing:.28em;text-transform:lowercase}
input[type=range]{width:100%;accent-color:var(--rojo)}
.fld{margin:12px 0;text-align:left}
.fld label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px}
.fld label b{color:var(--amarillo)}
.err{color:var(--rojo);font-size:12px;margin-top:7px;min-height:15px}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
table{width:100%;font-size:12.5px;border-collapse:collapse}
td{padding:4px 0;color:var(--mut);text-align:left}
td:last-child{text-align:right;color:var(--amarillo);font-weight:700}
@media (prefers-reduced-motion:reduce){
.ap-letra,.ap-subtitulo,.ap-boton,.carta-entra,.sello-pum,.pp-entra-dcha,.pp-entra-izq{animation:none!important;opacity:1!important;transform:none!important}
.ap-subtitulo{clip-path:none!important;transform:rotate(-3deg)!important}
.ap-bombilla{animation:none!important;fill:var(--c)}
.ap-cuernos::before,.ap-cuernos::after{animation:none!important;transform:rotate(var(--rot))}
.carta-sale,.pp-sale-izq,.pp-sale-dcha{animation:none!important;visibility:hidden}
.candado.is-denegado,.impacto-tiembla{animation:none!important}
.ruleta-disco.is-girando{animation:none!important;transform:rotate(var(--giro))}
.ruleta.is-girando,.ruleta.is-girando .ruleta-flecha,.ruleta.is-girando .ruleta-centro{animation:none!important}
}
</style>
</head>

yn:["Yo nunca... he mentido sobre mi edad.","Yo nunca... he fingido que me gustaba un regalo.","Yo nunca... me he quedado dormido en una fiesta.","Yo nunca... he mandado un mensaje y me he arrepentido.","Yo nunca... he mirado el móvil de mi pareja.","Yo nunca... he vuelto con un ex.","Yo nunca... he dicho te quiero sin sentirlo del todo.","Yo nunca... me he fijado en alguien de esta mesa y he disimulado.","Yo nunca... he besado a alguien la primera noche.","Yo nunca... he estado a punto de algo con alguien de esta casa.","Yo nunca... he dormido en la misma cama con tres personas.","Yo nunca... he mandado una foto que no debía.","Yo nunca... he fingido en la cama.","Yo nunca... me he arrepentido de un beso la mañana siguiente.","Yo nunca... he pensado en un ex durante."],
cl:[["Imita a alguien del grupo hasta que lo adivinen.","Habla con acento extranjero durante tres rondas.","Bébete un chupito sin usar las manos.","Deja que la persona a tu derecha te despeine."],["Da tres besos: uno en la mano, uno en el cuello y uno donde elijas.","Baila pegado con quien no sea tu pareja, un minuto.","Cuenta tu última fantasía sin decir nombres y que la adivinen.","Deja que el grupo te ponga un apodo y no te quejes en toda la noche."],["Beso de 10 segundos con quien diga el grupo.","Quítate una prenda y no te la vuelvas a poner.","Susúrrale al oído a alguien lo que le harías. Sin repetir persona.","Siéntate en el regazo de quien tú elijas y quédate hasta tu próximo turno."]]};
