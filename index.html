<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pecados">
<title>SIETE PECADOS</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{--tinta:#1A1026;--crema:#FFE9C7;--rojo:#FF3B30;--amarillo:#FFD23F;--morado:#9B5CFF;--rosa:#FF4FA3;--verde:#39D353;--naranja:#FF8A1F;--cian:#2EC8FF;--bg:var(--tinta);--pnl:#241733;--pnl2:#2e1e40;--linea:#3d2a52;--tx:var(--crema);--mut:#a893b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;position:relative;height:100vh;height:100dvh;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:16px 16px 26px;overflow-y:auto}
.screen.on{display:flex}
h1,h2,h3{margin:0;font-weight:800}
#cover{padding:0;overflow:hidden}
.ap-portada{position:relative;overflow:hidden;background:var(--tinta);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 96px;width:100%;height:100%}
.ap-portada-fondo{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.ap-cabecera{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:-30px}
.ap-titulo{margin:0;font-family:'Luckiest Guy',Impact,sans-serif;font-size:clamp(46px,15vw,64px);line-height:.86;color:var(--crema);text-shadow:0 6px 0 var(--tinta),0 0 26px rgba(255,59,48,.55);display:flex;flex-direction:column;align-items:center;gap:2px}
.ap-palabra{display:flex;gap:2px}
.ap-letra{display:inline-block;transform:rotate(var(--r));animation:ap-letra-entra .55s calc(var(--i)*70ms + 200ms) cubic-bezier(.2,1.5,.4,1) both}
.ap-palabra:last-child .ap-letra{color:var(--amarillo)}
.ap-cuernos{position:relative}
.ap-cuernos::before,.ap-cuernos::after{content:"";position:absolute;top:-14px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:22px solid var(--rojo);filter:drop-shadow(0 2px 0 var(--tinta))}
.ap-cuernos::before{left:2px;transform:rotate(-24deg)}
.ap-cuernos::after{right:2px;transform:rotate(24deg)}
@keyframes ap-letra-entra{from{opacity:0;transform:rotate(var(--r)) translateY(26px) scale(.6)}to{opacity:1;transform:rotate(var(--r)) translateY(0) scale(1)}}
.ap-subtitulo{font-size:clamp(11px,3.4vw,14px);letter-spacing:.22em;text-transform:uppercase;color:var(--crema);opacity:0;animation:ap-sub-entra .6s 1.05s ease-out both;text-shadow:0 2px 6px var(--tinta)}
@keyframes ap-sub-entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ap-bombillas{position:absolute;top:0;left:0;width:100%;height:auto;z-index:1}
.ap-bombilla{animation:ap-titila 2.4s calc(var(--i)*140ms) ease-in-out infinite}
@keyframes ap-titila{0%,100%{fill:var(--c);opacity:1;filter:drop-shadow(0 0 6px var(--c))}50%{fill:#4a3a2a;opacity:.5;filter:none}}
.ap-boton{position:absolute;bottom:6%;left:50%;translate:-50% 0;z-index:3;border:4px solid var(--tinta);background:var(--amarillo);color:var(--tinta);font-family:'Luckiest Guy',Impact,sans-serif;font-size:26px;letter-spacing:.08em;padding:14px 46px;border-radius:16px;box-shadow:0 7px 0 var(--tinta);cursor:pointer;opacity:0;animation:ap-boton-entra .5s 1.35s cubic-bezier(.2,1.6,.4,1) both}
.ap-boton:active{box-shadow:0 2px 0 var(--tinta);translate:-50% 5px}
@keyframes ap-boton-entra{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.pp-entra-dcha{animation:pp-dcha .26s ease-out both}
.pp-sale-izq{animation:pp-izq .26s ease-in both}
.pp-entra-izq{animation:pp-izq-r .26s ease-out both}
.pp-sale-dcha{animation:pp-dcha-r .26s ease-in both}
@keyframes pp-dcha{from{transform:translateX(34px);opacity:0}to{transform:none;opacity:1}}
@keyframes pp-izq{from{transform:none;opacity:1}to{transform:translateX(-34px);opacity:0}}
@keyframes pp-izq-r{from{transform:translateX(-34px);opacity:0}to{transform:none;opacity:1}}
@keyframes pp-dcha-r{from{transform:none;opacity:1}to{transform:translateX(34px);opacity:0}}
.carta-entra{animation:carta .34s cubic-bezier(.2,1.3,.35,1) both}
@keyframes carta{from{opacity:0;transform:translateY(18px) rotate(-1.2deg) scale(.96)}to{opacity:1;transform:none}}
.impacto-tiembla{animation:tiembla .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes tiembla{10%{transform:translate(-4px,1px)}20%{transform:translate(4px,-2px)}30%{transform:translate(-5px,0)}45%{transform:translate(5px,2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}100%{transform:none}}
.candado{display:block}
.candado-arco{transform-origin:60px 66px;transition:transform .38s cubic-bezier(.3,1.4,.4,1)}
.candado.is-abierto .candado-arco{transform:rotate(-26deg) translateY(-5px)}
.candado.is-abierto .candado-pupila{animation:candado-alegre .5s .15s both}
@keyframes candado-alegre{0%{r:3.6}40%{r:5}100%{r:2}}
.candado.is-denegado{animation:candado-no .4s}
.candado.is-denegado .candado-cuerpo{animation:candado-cabezazo .4s}
@keyframes candado-no{0%,100%{transform:none}25%{transform:translateX(-9px) rotate(-3deg)}55%{transform:translateX(8px) rotate(3deg)}80%{transform:translateX(-4px)}}
@keyframes candado-cabezazo{0%,100%{transform:translateY(0)}45%{transform:translateY(-5px) scale(1.03)}}
.candado.is-denegado .candado-ceja{animation:candado-ceño .4s}
@keyframes candado-ceño{0%,100%{transform:none}50%{transform:translateY(2px)}}
.ruleta{position:relative;width:min(84vw,300px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;margin-top:20px}
.ruleta-cuernos{position:absolute;top:-9%;left:50%;translate:-50% 0;width:100%;z-index:2;pointer-events:none}
.ruleta-disco{position:relative;z-index:1;width:100%;height:100%;transform:rotate(var(--giro,0deg))}
.ruleta-disco.is-girando{animation:ruleta-giro var(--dur,4200ms) cubic-bezier(.12,.62,.1,1) forwards}
@keyframes ruleta-giro{from{transform:rotate(var(--desde,0deg))}to{transform:rotate(var(--giro,1080deg))}}
.ruleta.is-girando .ruleta-cuernos{animation:ruleta-cuernos-eco var(--dur,4200ms) ease-out}
@keyframes ruleta-cuernos-eco{0%,100%{transform:none}20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}}
.ruleta-centro{position:absolute;top:50%;left:50%;translate:-50% -50%;z-index:3;pointer-events:none}
.ruleta-flecha{position:absolute;top:-2%;left:50%;margin-left:-31px;z-index:4;transform-origin:50% 8%;pointer-events:none}
.ruleta.is-girando .ruleta-flecha{animation:ruleta-flecha var(--dur,4200ms) ease-in-out}
@keyframes ruleta-flecha{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-9deg)}92%{transform:rotate(6deg)}95%{transform:rotate(-4deg)}}
.sello-pum{animation:sello .5s cubic-bezier(.2,1.6,.35,1) both}
@keyframes sello{0%{opacity:0;transform:scale(2.1) rotate(-24deg)}60%{opacity:1;transform:scale(.92) rotate(-6deg)}80%{transform:scale(1.06) rotate(-10deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
.av{position:relative;border-radius:12px;overflow:hidden;background:#120c1c;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.av svg{width:100%;height:100%;display:block}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.top h2{font-family:'Luckiest Guy',Impact,sans-serif;font-size:26px;color:var(--amarillo)}
.lockico{font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 12px}
.cast{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:flex;flex-direction:column;align-items:center;gap:3px;width:50px}
.chip .av{width:42px;height:42px}
.chip b{font-size:9px;color:var(--mut);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.gcard{position:relative;background:var(--pnl);border:2px solid var(--linea);border-radius:16px;padding:14px 13px;min-height:126px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden}
.gcard .ic{font-size:20px;color:var(--rojo);line-height:1}
.gcard h3{font-size:15.5px;margin-top:9px;font-family:'Luckiest Guy',Impact,sans-serif;letter-spacing:.03em;color:var(--crema)}
.gcard p{font-size:11px;color:var(--mut);margin:3px 0 0;line-height:1.3}
.gcard.locked{opacity:.6}
.gcard .pad{position:absolute;top:9px;right:9px}
.gcard .pad svg{width:26px;height:auto}
.gcard:active{transform:scale(.98)}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.back{border:2px solid var(--linea);background:var(--pnl);color:var(--tx);width:40px;height:40px;border-radius:11px;font-size:18px;cursor:pointer}
.who{display:flex;align-items:center;gap:9px}
.who .av{width:40px;height:40px}
.who b{font-size:14px;display:block}
.who i{font-style:normal;font-size:10px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.card{position:relative;background:linear-gradient(165deg,var(--pnl2),var(--pnl));border:3px solid var(--linea);border-radius:18px;padding:20px 18px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:250px}
.card .tag{font-family:'Luckiest Guy',Impact,sans-serif;font-size:12px;letter-spacing:.22em;color:var(--amarillo);margin-bottom:10px}
.card .txt{font-size:20px;line-height:1.38;font-weight:600}
.card .txt b{color:var(--amarillo)}
.card .duo{display:flex;gap:7px;margin-top:14px}
.card .duo .av{width:36px;height:36px}
.acts{display:flex;gap:9px;margin-top:12px}
.btn{display:block;width:100%;border:3px solid var(--tinta);border-radius:14px;padding:14px;font-size:15px;font-weight:800;font-family:'Luckiest Guy',Impact,sans-serif;letter-spacing:.05em;background:var(--amarillo);color:var(--tinta);cursor:pointer;box-shadow:0 5px 0 var(--tinta)}
.btn:active{box-shadow:0 1px 0 var(--tinta);translate:0 4px}
.btn.ghost{background:var(--pnl);color:var(--crema);border-color:var(--linea);box-shadow:0 5px 0 var(--tinta)}
.btn.rojo{background:var(--rojo);color:var(--crema)}
.btn.sm{padding:11px;font-size:13px}
.acts .btn{flex:1}
.center{text-align:center;align-items:center;justify-content:center}
.big{font-family:'Luckiest Guy',Impact,sans-serif;font-size:74px;line-height:1;color:var(--amarillo)}
.hint{color:var(--mut);font-size:12px;text-align:center;margin-top:12px}
.roul{display:flex;justify-content:center}
.legend{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.legend .chip{width:44px}
.legend .chip .av{width:30px;height:30px;border-radius:8px}
.legend .chip b{font-size:8px}
.sello{position:absolute;left:50%;top:50%;translate:-50% -50%;width:230px;max-width:82%;pointer-events:none;z-index:5}
.ov{position:fixed;inset:0;background:rgba(10,7,15,.9);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
.ov.on{display:flex}
.box{background:var(--pnl);border:3px solid var(--linea);border-radius:18px;padding:20px;width:100%;max-width:360px;max-height:88vh;overflow:auto;text-align:center}
.box h3{font-family:'Luckiest Guy',Impact,sans-serif;font-size:20px;color:var(--amarillo);margin-bottom:6px}
.box p{color:var(--mut);font-size:12.5px;margin:0 0 14px}
.box .candado svg{width:74px;height:auto;margin-bottom:8px}
input[type=text]{width:100%;background:#140e1e;border:2px solid var(--linea);color:var(--crema);border-radius:11px;padding:13px;font-size:17px;font-family:inherit;text-align:center;letter-spacing:.28em;text-transform:lowercase}
input[type=range]{width:100%;accent-color:var(--rojo)}
.fld{margin:12px 0;text-align:left}
.fld label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px}
.fld label b{color:var(--amarillo)}
.err{color:var(--rojo);font-size:12px;margin-top:7px;min-height:15px}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
table{width:100%;font-size:12.5px;border-collapse:collapse}
td{padding:4px 0;color:var(--mut);text-align:left}
td:last-child{text-align:right;color:var(--amarillo);font-weight:700}
@media (prefers-reduced-motion:reduce){
.ap-letra,.ap-subtitulo,.ap-boton,.ap-bombilla,.pp-entra-dcha,.pp-sale-izq,.pp-entra-izq,.pp-sale-dcha,.carta-entra,.impacto-tiembla,.candado,.candado-arco,.candado-cuerpo,.candado-ceja,.candado-pupila,.ruleta-cuernos,.ruleta-flecha,.sello-pum{animation:none!important;opacity:1!important;transform:none!important}
.ruleta-disco.is-girando{animation:ruleta-giro var(--dur,4200ms) cubic-bezier(.12,.62,.1,1) forwards!important}
}
</style>
</head>

function ciegoReveal(l,btn){vib(40);stage().innerHTML=`<div class="card carta-entra"><div class="tag">NIVEL ${l+1} · RETO</div><div class="txt">${btn.dataset.t}</div></div><div class="acts"><button class="btn" onclick="ciego()">OTRO</button></div>`}
let lp;
document.getElementById('cover').addEventListener('pointerdown',()=>{lp=setTimeout(openAdmin,750)});
['pointerup','pointerleave','pointercancel'].forEach(e=>document.getElementById('cover').addEventListener(e,()=>clearTimeout(lp)));
function openAdmin(){vib(40);document.getElementById('rEr').value=S.er;document.getElementById('rMa').value=S.ma;document.getElementById('rEm').value=Math.round(S.em*100);
document.getElementById('vEr').textContent=S.er;document.getElementById('vMa').textContent=S.ma;document.getElementById('vEm').textContent=emWord(Math.round(S.em*100));
document.getElementById('codeSet').value=S.code;
const t=Object.entries(S.tally).sort((a,b)=>b[1]-a[1]);
document.getElementById('tally').innerHTML=t.length?t.map(([id,v])=>`<tr><td>${byId(id)?byId(id).n:id}</td><td>${v}</td></tr>`).join(''):'<tr><td>Nadie todavía</td><td>0</td></tr>';
document.getElementById('adminOv').classList.add('on')}
['rEr','rMa','rEm'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{const v=+e.target.value;
if(id==='rEr'){S.er=v;document.getElementById('vEr').textContent=v.toFixed(1)}
if(id==='rMa'){S.ma=v;document.getElementById('vMa').textContent=v.toFixed(1)}
if(id==='rEm'){S.em=v/100;document.getElementById('vEm').textContent=emWord(v)}}));
function saveAdmin(){const c=document.getElementById('codeSet').value.trim().toLowerCase();if(c)S.code=c;save();closeOv('adminOv');vib(30)}
function resetAll(){localStorage.removeItem('siete');location.reload()}
renderHub();

  const mf={name:'Siete Pecados',short_name:'Siete Pecados',display:'standalone',orientation:'portrait',background_color:'#1A1026',theme_color:'#1A1026',icons:[{src:ico,sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};

 if('serviceWorker' in navigator){
  const code="self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',()=>{});";
  try{navigator.serviceWorker.register(URL.createObjectURL(new Blob([code],{type:'text/javascript'}))).catch(()=>{})}catch(e){}
 }
})();
